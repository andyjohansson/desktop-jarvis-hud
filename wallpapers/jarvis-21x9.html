<!doctype html>
<!--
  Jarvis desktop wallpaper for 21:9 ultrawide screens. Generated from
  templates/jarvis-21x9.html by build.mjs, edit the template, or the
  engine in obsidian-jarvis-hud, not this file.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis 21:9</title>
<style>
  :root {
    --bg: #05090d;
    --cyan: #00d8ff;
    --cyan-rgb: 0, 216, 255;
    --soft: #7deeff;
    --dim: rgba(125, 238, 255, 0.45);
    --line: rgba(0, 216, 255, 0.22);
    --label: "Avenir Next Condensed", "DIN Condensed", "Helvetica Neue", sans-serif;
    --data: "SF Mono", Menlo, monospace;
    /* Everything is sized from the screen height, so it scales with any screen */
    --u: 1vh;
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--soft);
  }
  /* The same faint HUD grid and top glow as the Obsidian theme, plus a
     vignette so the edges fall away into the dark */
  body {
    background-image:
      radial-gradient(ellipse 60% 50% at 50% -10%, rgba(var(--cyan-rgb), 0.07), transparent 70%),
      radial-gradient(ellipse 75% 95% at 50% 50%, transparent 45%, rgba(0, 0, 0, 0.6)),
      linear-gradient(rgba(var(--cyan-rgb), 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(var(--cyan-rgb), 0.035) 1px, transparent 1px);
    background-size: 100% 100%, 100% 100%, 44px 44px, 44px 44px;
    font-family: var(--label);
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }

  /* ---------- Jarvis ---------- */
  /* Absolute, not fixed: the engine skips drawing when the canvas has no
     offsetParent, which a fixed element never has */
  .jarvis-mind-wallpaper {
    position: absolute;
    left: 50%;
    top: 50%;
    width: var(--size);
    height: var(--size);
    translate: -50% -50%;
    opacity: 0.85;
  }
  .aura {
    position: absolute;
    left: 50%;
    top: 50%;
    width: calc(var(--size) * 1.6);
    aspect-ratio: 1;
    translate: -50% -50%;
    border-radius: 50%;
    background: radial-gradient(closest-side, rgba(var(--cyan-rgb), 0.07), rgba(var(--cyan-rgb), 0.02) 60%, transparent);
    pointer-events: none;
  }

  /* ---------- Panels ---------- */
  .panel {
    position: absolute;
    top: 50%;
    translate: 0 -50%;
    width: calc(var(--u) * 34);
    display: flex;
    flex-direction: column;
    gap: calc(var(--u) * 2.2);
    opacity: 0.75;
  }
  #left { left: 4.5%; }
  #right { right: 4.5%; }
  .panel h3 {
    margin: 0 0 calc(var(--u) * 0.9);
    font-size: calc(var(--u) * 1.25);
    font-weight: 600;
    color: var(--dim);
    border-bottom: 1px solid var(--line);
    padding-bottom: calc(var(--u) * 0.5);
  }
  .panel h3::before {
    content: "";
    display: inline-block;
    width: calc(var(--u) * 0.6);
    height: calc(var(--u) * 0.6);
    margin-right: calc(var(--u) * 0.8);
    background: var(--cyan);
    box-shadow: 0 0 6px var(--cyan);
    vertical-align: middle;
  }

  /* Telemetry: lines scroll in at the top and fade out below */
  .telemetry {
    height: calc(var(--u) * 22);
    overflow: hidden;
    font-family: var(--data);
    font-size: calc(var(--u) * 1.15);
    line-height: 1.55;
    letter-spacing: 0.06em;
    text-transform: none;
    color: var(--soft);
    -webkit-mask-image: linear-gradient(#000 40%, transparent);
    mask-image: linear-gradient(#000 40%, transparent);
  }
  .telemetry div { white-space: nowrap; }
  .telemetry span { color: var(--dim); }

  /* Meters: bars that rise and fall on their own uneven rhythms */
  .meters {
    display: flex;
    align-items: flex-end;
    gap: calc(var(--u) * 0.7);
    height: calc(var(--u) * 7);
  }
  .meters i {
    flex: 1;
    height: 100%;
    background: linear-gradient(to top, rgba(var(--cyan-rgb), 0.55), rgba(var(--cyan-rgb), 0.12));
    transform-origin: bottom;
    animation: meter var(--t) ease-in-out var(--d) infinite alternate;
  }
  @keyframes meter {
    0% { transform: scaleY(0.15); }
    35% { transform: scaleY(0.7); }
    60% { transform: scaleY(0.35); }
    100% { transform: scaleY(0.9); }
  }

  /* Clock */
  .clock .time {
    font-family: var(--data);
    font-size: calc(var(--u) * 5);
    letter-spacing: 0.04em;
    color: var(--cyan);
    text-shadow: 0 0 10px rgba(var(--cyan-rgb), 0.5);
    line-height: 1;
  }
  .clock .date {
    margin-top: calc(var(--u) * 0.8);
    font-size: calc(var(--u) * 1.4);
    color: var(--dim);
  }

  /* Radar: a sweep turning over rings, with blips that flare when it passes */
  .scope {
    display: flex;
    gap: calc(var(--u) * 2.5);
    align-items: center;
  }
  .radar {
    position: relative;
    flex: none;
    width: calc(var(--u) * 13);
    aspect-ratio: 1;
    border-radius: 50%;
    border: 1px solid var(--line);
    background:
      radial-gradient(circle, transparent 32%, var(--line) 32.5%, transparent 33.5%),
      radial-gradient(circle, transparent 65%, var(--line) 65.5%, transparent 66.5%),
      linear-gradient(var(--line), var(--line)) center / 1px 100% no-repeat,
      linear-gradient(var(--line), var(--line)) center / 100% 1px no-repeat;
    overflow: hidden;
  }
  .radar::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(from 0deg, rgba(var(--cyan-rgb), 0.35), transparent 70deg);
    animation: spin 6s linear infinite;
  }
  .radar i {
    position: absolute;
    width: 4px;
    height: 4px;
    margin: -2px;
    border-radius: 50%;
    background: var(--soft);
    box-shadow: 0 0 6px var(--cyan);
    opacity: 0;
    animation: blip 6s linear var(--d) infinite;
  }
  @keyframes spin { to { rotate: 360deg; } }
  @keyframes blip {
    0%, 2% { opacity: 1; }
    40%, 100% { opacity: 0; }
  }
  .waveform {
    flex: 1;
    height: calc(var(--u) * 9);
  }
  .waveform polyline {
    fill: none;
    stroke: var(--soft);
    stroke-width: 1.2;
    filter: drop-shadow(0 0 3px var(--cyan));
  }

  /* Status rows with a value on the right */
  .rows div {
    display: flex;
    justify-content: space-between;
    font-size: calc(var(--u) * 1.2);
    color: var(--dim);
    padding: calc(var(--u) * 0.35) 0;
    border-bottom: 1px solid rgba(var(--cyan-rgb), 0.08);
  }
  .rows b {
    font-family: var(--data);
    font-weight: 400;
    letter-spacing: 0.05em;
    color: var(--soft);
  }

  /* ---------- Frame: header, footer, ruler and corners ---------- */
  .bar {
    position: absolute;
    left: 4%;
    right: 4%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: calc(var(--u) * 1.2);
    color: var(--dim);
    opacity: 0.8;
  }
  .bar.top { top: 3.2%; }
  .bar.bottom { bottom: 3.2%; }
  .bar .live::before {
    content: "";
    display: inline-block;
    width: calc(var(--u) * 0.7);
    height: calc(var(--u) * 0.7);
    margin-right: calc(var(--u) * 0.9);
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 6px var(--cyan);
    vertical-align: middle;
    animation: breathe 2.8s ease-in-out infinite;
  }
  @keyframes breathe {
    50% { opacity: 0.45; }
  }
  .ruler {
    position: absolute;
    left: 4%;
    right: 4%;
    bottom: 6.5%;
    height: calc(var(--u) * 1.2);
    background:
      repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 2.5%),
      repeating-linear-gradient(90deg, rgba(var(--cyan-rgb), 0.12) 0 1px, transparent 1px 0.5%) bottom / 100% 40% no-repeat;
    opacity: 0.8;
  }
  .ruler::after {
    content: "";
    position: absolute;
    top: -30%;
    bottom: -30%;
    width: 2px;
    background: var(--soft);
    box-shadow: 0 0 8px var(--cyan);
    animation: scan 24s ease-in-out infinite alternate;
  }
  @keyframes scan {
    from { left: 0; }
    to { left: 100%; }
  }
  .corner {
    position: absolute;
    width: calc(var(--u) * 4);
    height: calc(var(--u) * 4);
    border: 0 solid rgba(var(--cyan-rgb), 0.4);
  }
  .corner.tl { top: 2%; left: 1.5%; border-top-width: 2px; border-left-width: 2px; }
  .corner.tr { top: 2%; right: 1.5%; border-top-width: 2px; border-right-width: 2px; }
  .corner.bl { bottom: 2%; left: 1.5%; border-bottom-width: 2px; border-left-width: 2px; }
  .corner.br { bottom: 2%; right: 1.5%; border-bottom-width: 2px; border-right-width: 2px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
  }
</style>
</head>
<body>
<div class="aura"></div>

<div class="corner tl"></div><div class="corner tr"></div>
<div class="corner bl"></div><div class="corner br"></div>

<div class="bar top">
  <span class="live">J.A.R.V.I.S. · All systems online</span>
  <span>Neural interface · Calm mode</span>
  <span id="session">Session 00:00:00</span>
</div>
<div class="ruler"></div>
<div class="bar bottom">
  <span>Core sync <b id="sync">99.97%</b></span>
  <span id="grid">Grid 7G-41 · Sector clear</span>
  <span>Build mk-85</span>
</div>

<div class="panel" id="left">
  <section>
    <h3>Telemetry</h3>
    <div class="telemetry" id="telemetry"></div>
  </section>
  <section>
    <h3>Subroutine load</h3>
    <div class="meters" id="meters"></div>
  </section>
  <section class="rows" id="rows-left"></section>
</div>

<div class="panel" id="right">
  <section class="clock">
    <h3>Local time</h3>
    <div class="time" id="time">00:00:00</div>
    <div class="date" id="date"></div>
  </section>
  <section>
    <h3>Perimeter scan</h3>
    <div class="scope">
      <div class="radar" id="radar"></div>
      <svg class="waveform" id="wave" viewBox="0 0 200 60" preserveAspectRatio="none"><polyline id="wave-line"></polyline></svg>
    </div>
  </section>
  <section class="rows" id="rows-right"></section>
</div>

<script>
const MIND_CLASS = "jarvis-mind";
const MIND_SIZE = 40; // CSS pixels, matched in jarvis-claudian.css
const MIND_NODES = 30;
const MIND_PACE = 0.5;
const MIND_WAKE_EVERY_MS = 10000;
const MIND_WAKE_MAX = 8;
const NO_MOTION_CLASS = "jarvis-no-motion";

// @mind-engine:start
// Everything between the mind-engine markers is copied into the desktop
// wallpapers by build.mjs in desktop-jarvis-hud. Keep it free of Obsidian
// APIs.
//
// The mind: a hologram of Jarvis thinking, modelled on Jarvis in Age of
// Ultron. Shells of broken, tick-marked arcs turn at their own speeds around
// an eye with a slowly breathing pupil, spokes and a tilted band, filaments
// crackle in and out, and signals set off chain reactions in a network of
// neurons. One engine draws both versions, so a change shows in both:
//
// - Working: small, in front of Claudian's working line. Thoughts fire all
//   the time, and the longer Claude works the more neurons wake up and
//   shine bright, one every MIND_WAKE_EVERY_MS from when the response
//   started.
// - Calm: large, behind the welcome screen. Nothing fires on its own. While
//   you type it brightens and starts to stir, and spike() provokes it.
//   With `dream`, a lone thought fires now and then even when calm (the
//   desktop wallpaper), and `fps` caps the frame rate to save power.
//
// Everything is drawn in MIND_SIZE units and scaled to the canvas, with
// `thin` keeping lines fine when the canvas is large. Each canvas runs its
// own loop, which stops once the canvas leaves the page.
function mind(doc, options = {}) {
  const {
    size = MIND_SIZE,
    count = MIND_NODES,
    thin = 1,
    pace = MIND_PACE,
    start = null,
    calm = false,
    listening = () => false,
    dream = null,
    fps = 0,
    className = MIND_CLASS,
  } = options;
  const win = doc.defaultView ?? window;
  const canvas = doc.createElement("canvas");
  canvas.className = className;
  canvas.setAttribute("aria-hidden", "true");
  const dpr = win.devicePixelRatio || 1;
  canvas.width = canvas.height = Math.round(size * dpr);
  const ctx = canvas.getContext("2d");
  ctx.scale((dpr * size) / MIND_SIZE, (dpr * size) / MIND_SIZE);
  const lw = (w) => (ctx.lineWidth = w * thin);

  const rand = (a, b) => a + Math.random() * (b - a);
  const TAU = Math.PI * 2;
  const c = MIND_SIZE / 2;
  const R = MIND_SIZE * 0.42;

  // Shells: concentric rings of broken arcs. The outer ones carry tick marks.
  // The arcs are spread evenly around each ring, with a little jitter, so
  // the sphere stays balanced.
  const shells = [0.4, 0.56, 0.7, 0.84, 0.98].map((f, i) => {
    const n = 3 + Math.floor(Math.random() * 3);
    return {
      r: f * R,
      speed: rand(0.2, 0.7) * (i % 2 ? -1 : 1),
      phase: rand(0, TAU),
      ticks: i >= 2,
      segs: Array.from({ length: n }, (_, k) => ({
        start: (k * TAU) / n + rand(-0.15, 0.15),
        len: (TAU / n) * rand(0.5, 0.8),
        alpha: 1,
        target: 1,
        next: 0,
      })),
    };
  });

  // Neurons in a loose disc, drifting a little in place. Each links to its
  // nearest neighbours.
  const nodes = Array.from({ length: count }, () => {
    const a = rand(0, TAU);
    const r = R * Math.sqrt(Math.random()) * 0.92;
    return { x: Math.cos(a) * r, y: Math.sin(a) * r, f: rand(0.5, 1.4), p: rand(0, TAU), glow: 0 };
  });
  const links = new Map(nodes.map((_, i) => [i, new Set()]));
  nodes.forEach((n, i) => {
    nodes
      .map((m, j) => [j, (n.x - m.x) ** 2 + (n.y - m.y) ** 2])
      .filter(([j]) => j !== i)
      .sort((a, b) => a[1] - b[1])
      .slice(0, 3)
      .forEach(([j]) => {
        links.get(i).add(j);
        links.get(j).add(i);
      });
  });
  const edges = [];
  for (const [i, set] of links) for (const j of set) if (i < j) edges.push([i, j]);

  // Signals keep their brightness as they travel, so a thought that starts in a
  // neuron that is awake stays bright through the whole chain.
  const signals = [];
  const fire = (from, depth, lit = false) => {
    nodes[from].glow = 1;
    const next = [...links.get(from)];
    const count = depth === 0 ? 2 : Math.random() < 0.55 ? 1 : 0;
    const bright = lit || nodes[from].awake;
    for (let k = 0; k < count && next.length; k++) {
      const to = next.splice(Math.floor(Math.random() * next.length), 1)[0];
      signals.push({ from, to, t: 0, speed: rand(0.03, 0.06), depth, bright });
    }
  };

  // The crackle: on an uneven beat, arcs, spokes and the band get a new
  // brightness to ease towards, and filaments and sparks fade in and out.
  // Easing instead of snapping keeps it smooth at a calm pace.
  let filaments = [];
  let sparks = [];
  const spokes = Array.from({ length: 7 }, () => ({ a: rand(0, TAU), reach: rand(0.7, 1.08), alpha: 0.5, target: 0.5 }));
  const band = { alpha: 1, target: 1 };
  const fade = (item, now) => item.alpha * Math.sin(Math.PI * Math.min(1, Math.max(0, (now - item.born) / (item.until - item.born))));
  const point = (reach) => {
    const a = rand(0, TAU);
    const r = R * reach * Math.sqrt(Math.random());
    return [c + Math.cos(a) * r, c + Math.sin(a) * r];
  };
  const crackle = (now) => {
    for (const shell of shells) {
      // Each arc keeps its brightness for a while, so the rings shimmer
      // slowly instead of blinking.
      for (const seg of shell.segs) {
        if (now < seg.next) continue;
        seg.target = Math.random() < 0.1 ? 0.3 : rand(0.55, 1);
        seg.next = now + rand(700, 2000);
      }
    }
    filaments = filaments.filter((f) => f.until > now);
    while (filaments.length < 9) {
      const [x1, y1] = point(0.9);
      const [x2, y2] = point(Math.random() < 0.25 ? 1.2 : 0.95);
      filaments.push({ x1, y1, x2, y2, born: now, until: now + rand(250, 900), alpha: rand(0.3, 0.75) });
    }
    sparks = sparks.filter((sk) => sk.until > now);
    while (sparks.length < 6) {
      const [x, y] = point(1.05);
      sparks.push({ x, y, born: now, until: now + rand(150, 500), alpha: 0.9 });
    }
    for (const sp of spokes) {
      sp.target = rand(0.25, 0.75);
      // A spoke that moves fades out first, then comes back at its new angle.
      if (sp.alpha < 0.05 && sp.moving) Object.assign(sp, { a: rand(0, TAU), reach: rand(0.7, 1.08), moving: false });
      if (Math.random() < 0.04) sp.moving = true;
      if (sp.moving) sp.target = 0;
    }
    band.target = rand(0.7, 1);
  };
  const ease = (item, k) => {
    item.alpha += (item.target - item.alpha) * k;
  };

  // Wakes one more neuron. A new one ignites with a flash, a small ring
  // and a bright chain reaction; the ones already awake just appear.
  let awake = 0;
  const wakeTarget = () =>
    start === null ? 0 : Math.min(MIND_WAKE_MAX, Math.floor((Date.now() - start) / MIND_WAKE_EVERY_MS));
  const ignite = (now, burst) => {
    const asleep = nodes.map((n, i) => i).filter((i) => !nodes[i].awake);
    const i = asleep[Math.floor(Math.random() * asleep.length)];
    nodes[i].awake = true;
    awake++;
    if (!burst) return;
    nodes[i].born = now;
    fire(i, 0, true);
  };
  while (awake < wakeTarget()) ignite(0, false);

  // Calm mode: `level` rises while you type, `flash` jumps on a spike and
  // fades. Both brighten the hologram; the flash also makes the pupil
  // contract, as if startled.
  let level = 0;
  let flash = 0;
  let clock = 0;
  let last = null;
  let nextCrackle = 0;
  let nextThought = 0;

  // Everything runs on its own clock, slowed by `pace` and sped up a little
  // while listening. Waking up stays on real time.
  const draw = (real, animate) => {
    const step = last === null ? 16.7 : Math.min(real - last, 50);
    last = real;
    const stir = listening() ? 1 : 0;
    level += (stir - level) * (1 - Math.pow(0.97, step / 16.7));
    clock += step * pace * (1 + 0.6 * level);
    const now = clock;
    const dt = (step * pace * (1 + 0.6 * level)) / 16.7;
    flash = Math.max(0, flash - 0.02 * dt);
    const t = now / 1000;
    if (now > nextCrackle) {
      crackle(now);
      nextCrackle = now + rand(50, 110);
    }
    const k = 1 - Math.pow(0.8, dt);
    const slow = 1 - Math.pow(0.94, dt);
    for (const shell of shells) for (const seg of shell.segs) ease(seg, slow);
    for (const sp of spokes) ease(sp, k);
    ease(band, k);
    ctx.clearRect(0, 0, MIND_SIZE, MIND_SIZE);
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = Math.min(1, (calm ? 0.65 + 0.25 * level : 1) + 0.35 * flash);

    // Soft glow behind the eye, brightest around the iris and dim in the
    // pupil. The pupil dilates and contracts on an uneven rhythm.
    const breath = 0.65 + 0.2 * Math.sin(t * 1.7) + 0.15 * Math.sin(t * 4.3 + 1);
    const iris = R * (0.17 + 0.03 * Math.sin(t * 0.9) + 0.015 * Math.sin(t * 2.3 + 2)) * (1 - 0.35 * flash);
    const glow = ctx.createRadialGradient(c, c, 0, c, c, R * 0.75);
    glow.addColorStop(0, "rgba(0, 216, 255, 0.05)");
    glow.addColorStop(iris / (R * 0.75), `rgba(125, 238, 255, ${0.45 * breath + 0.4 * flash})`);
    glow.addColorStop(1, "rgba(0, 216, 255, 0)");
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, MIND_SIZE, MIND_SIZE);

    // Outer glow: a faint, steady halo hugging the edge of the sphere.
    // It ends before the canvas edge, or the corners would cut it square.
    const halo = ctx.createRadialGradient(c, c, R * 0.82, c, c, R * 1.17);
    halo.addColorStop(0, "rgba(0, 216, 255, 0)");
    halo.addColorStop(0.4, `rgba(0, 216, 255, ${0.035 + 0.06 * flash})`);
    halo.addColorStop(1, "rgba(0, 216, 255, 0)");
    ctx.fillStyle = halo;
    ctx.fillRect(0, 0, MIND_SIZE, MIND_SIZE);

    // The band: a tilted ring across the middle, seen almost edge on.
    ctx.save();
    ctx.translate(c, c);
    ctx.rotate(-0.14 + 0.04 * Math.sin(t * 0.4));
    ctx.scale(1, 0.26);
    lw(0.6);
    for (const [r, alpha] of [[R * 1.04, 0.55], [R * 0.94, 0.35]]) {
      ctx.strokeStyle = `rgba(125, 238, 255, ${alpha * band.alpha})`;
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, TAU);
      ctx.stroke();
    }
    ctx.restore();

    // Spokes: straight lines from the iris out to the shell, flickering.
    lw(0.4);
    for (const sp of spokes) {
      ctx.strokeStyle = `rgba(125, 238, 255, ${sp.alpha})`;
      ctx.beginPath();
      ctx.moveTo(c + Math.cos(sp.a) * iris * 1.4, c + Math.sin(sp.a) * iris * 1.4);
      ctx.lineTo(c + Math.cos(sp.a) * R * sp.reach, c + Math.sin(sp.a) * R * sp.reach);
      ctx.stroke();
    }

    // The eye: a bright iris ring, a thinner broken ring around it, and a
    // faint inner ring at the edge of the pupil.
    ctx.strokeStyle = `rgba(230, 251, 255, ${0.6 + 0.35 * breath})`;
    lw(0.9);
    ctx.beginPath();
    ctx.arc(c, c, iris, 0, TAU);
    ctx.stroke();
    ctx.strokeStyle = "rgba(125, 238, 255, 0.7)";
    lw(0.45);
    for (let k = 0; k < 4; k++) {
      const a = t * 0.5 + (k * TAU) / 4;
      ctx.beginPath();
      ctx.arc(c, c, iris * 1.5, a, a + 1.2);
      ctx.stroke();
    }
    ctx.strokeStyle = "rgba(0, 216, 255, 0.5)";
    ctx.beginPath();
    ctx.arc(c, c, iris * 0.6, 0, TAU);
    ctx.stroke();

    // Shells: perfect circles, each turning its own way.
    shells.forEach((shell, i) => {
      ctx.save();
      ctx.translate(c, c);
      ctx.rotate(shell.phase + t * shell.speed);
      for (const seg of shell.segs) {
        ctx.strokeStyle = `rgba(125, 238, 255, ${0.55 * seg.alpha})`;
        lw(0.5);
        ctx.beginPath();
        ctx.arc(0, 0, shell.r, seg.start, seg.start + seg.len);
        ctx.stroke();
        if (!shell.ticks) continue;
        ctx.strokeStyle = `rgba(0, 216, 255, ${0.7 * seg.alpha})`;
        lw(0.7);
        ctx.beginPath();
        for (let a = seg.start; a < seg.start + seg.len; a += 0.2) {
          // The outer ticks are jagged, each with its own fixed length.
          const out = i === shells.length - 1 ? 1.8 + 0.7 * Math.sin(a * 7.3 + seg.start * 13) : 1.3;
          ctx.moveTo(Math.cos(a) * shell.r, Math.sin(a) * shell.r);
          ctx.lineTo(Math.cos(a) * (shell.r + out), Math.sin(a) * (shell.r + out));
        }
        ctx.stroke();
      }
      ctx.restore();
    });

    // Meridians: two arcs swinging slowly, so it reads as a sphere.
    lw(0.45);
    for (let m = 0; m < 2; m++) {
      const swing = Math.cos(t * 0.5 + m * 1.9);
      ctx.save();
      ctx.translate(c, c);
      ctx.rotate(0.3 + m * 1.2);
      ctx.scale(Math.max(0.05, Math.abs(swing)), 1);
      ctx.strokeStyle = `rgba(125, 238, 255, ${0.35})`;
      ctx.beginPath();
      ctx.arc(0, 0, R * 0.95, -1.2, 1.2);
      ctx.stroke();
      ctx.restore();
    }

    // Filaments.
    lw(0.4);
    for (const f of filaments) {
      ctx.strokeStyle = `rgba(125, 238, 255, ${fade(f, now)})`;
      ctx.beginPath();
      ctx.moveTo(f.x1, f.y1);
      ctx.lineTo(f.x2, f.y2);
      ctx.stroke();
    }

    // Neurons and synapses.
    const p = nodes.map((n) => ({
      x: c + n.x + Math.sin(t * n.f + n.p) * 0.7,
      y: c + n.y + Math.cos(t * n.f * 0.8 + n.p) * 0.7,
    }));
    lw(0.4);
    for (const [i, j] of edges) {
      const lit = Math.max(nodes[i].glow, nodes[j].glow);
      ctx.strokeStyle = `rgba(0, 216, 255, ${0.12 + 0.6 * lit})`;
      ctx.beginPath();
      ctx.moveTo(p[i].x, p[i].y);
      ctx.lineTo(p[j].x, p[j].y);
      ctx.stroke();
    }
    if (animate && awake < wakeTarget()) ignite(now, true);
    // Thoughts start at random moments, not on a beat. Calm, only while
    // listening or dreaming, and far apart.
    if (animate && now > nextThought && (!calm || stir || dream)) {
      fire(Math.floor(Math.random() * nodes.length), 0);
      nextThought = now + (!calm ? rand(100, 450) : stir ? rand(500, 1400) : rand(dream[0], dream[1]));
    }
    for (let k = signals.length - 1; k >= 0; k--) {
      const s = signals[k];
      s.t += s.speed * dt;
      if (s.t >= 1) {
        signals.splice(k, 1);
        if (s.depth < 6) fire(s.to, s.depth + 1, s.bright);
        continue;
      }
      const a = p[s.from];
      const b = p[s.to];
      ctx.fillStyle = s.bright ? "rgba(255, 255, 255, 1)" : "rgba(230, 251, 255, 0.85)";
      ctx.beginPath();
      ctx.arc(a.x + (b.x - a.x) * s.t, a.y + (b.y - a.y) * s.t, 0.8 * thin, 0, TAU);
      ctx.fill();
    }
    nodes.forEach((n, i) => {
      const { x, y } = p[i];
      if (n.glow > 0.05) {
        const gr = 1.6 * thin;
        const g = ctx.createRadialGradient(x, y, 0, x, y, gr);
        g.addColorStop(0, `rgba(230, 251, 255, ${0.8 * n.glow})`);
        g.addColorStop(1, "rgba(0, 216, 255, 0)");
        ctx.fillStyle = g;
        ctx.fillRect(x - gr, y - gr, gr * 2, gr * 2);
      }
      const age = n.born ? (now - n.born) / 900 : 1;
      if (age < 1) {
        ctx.strokeStyle = `rgba(125, 238, 255, ${0.8 * (1 - age)})`;
        lw(0.4);
        ctx.beginPath();
        ctx.arc(x, y, (1 + age * 3.5) * thin, 0, TAU);
        ctx.stroke();
      }
      ctx.fillStyle = n.awake ? "rgba(230, 251, 255, 0.95)" : `rgba(125, 238, 255, ${0.5 + 0.5 * n.glow})`;
      ctx.beginPath();
      ctx.arc(x, y, (n.awake ? 0.8 + (age < 1 ? 0.6 * (1 - age) : 0) : 0.55) * thin, 0, TAU);
      ctx.fill();
      n.glow = Math.max(0, n.glow - 0.035 * dt);
    });

    // Sparks.
    for (const sk of sparks) {
      ctx.fillStyle = `rgba(230, 251, 255, ${fade(sk, now)})`;
      ctx.fillRect(sk.x - 0.35 * thin, sk.y - 0.35 * thin, 0.7 * thin, 0.7 * thin);
    }
  };

  // Provokes it: several neurons fire at once in bright chain reactions
  // and the eye flashes.
  const spike = (neurons = 4) => {
    flash = 1;
    for (let k = 0; k < neurons; k++) fire(Math.floor(Math.random() * nodes.length), 0, true);
  };

  const still =
    doc.body.classList.contains(NO_MOTION_CLASS) || win.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (still) {
    for (let k = 0; k < 4; k++) nodes[Math.floor(Math.random() * count)].glow = 0.8;
    draw(performance.now(), false);
    return { canvas, spike: () => {} };
  }
  let drawn = 0;
  const loop = (now) => {
    if (!canvas.isConnected && canvas.dataset.started) return;
    if (canvas.isConnected) canvas.dataset.started = "1";
    // A hidden canvas (the welcome screen in a busy chat) skips drawing.
    if (canvas.offsetParent === null) last = null;
    else if (!fps || now - drawn >= 1000 / fps - 2) {
      drawn = now;
      draw(now, true);
    }
    win.requestAnimationFrame(loop);
  };
  win.requestAnimationFrame(loop);
  return { canvas, spike };
}

// Settings come from the URL:
//   ?size=66     how big Jarvis is, in percent of the screen height
//   &fps=30      frame rate cap, lower saves power
//   &panels=0    hide the side panels and keep only Jarvis
const params = new URLSearchParams(location.search);
const num = (key, fallback) => {
  const value = Number(params.get(key));
  return params.has(key) && Number.isFinite(value) ? value : fallback;
};
const share = num("size", 66) / 100;
const fps = num("fps", 30);
const panels = num("panels", 1) !== 0;
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (list) => list[Math.floor(Math.random() * list.length)];

for (const id of ["left", "right"]) document.getElementById(id).hidden = !panels;

let jarvis = null;
const build = () => {
  const size = Math.round(innerHeight * share);
  document.documentElement.style.setProperty("--size", `${size}px`);
  jarvis?.canvas.remove();
  jarvis = mind(document, {
    size,
    count: 90,
    // Keeps lines and neurons the same few pixels wide at any size.
    thin: 170 / size,
    pace: 0.25,
    calm: true,
    dream: [2500, 7000],
    fps,
    className: "jarvis-mind-wallpaper",
  });
  document.body.append(jarvis.canvas);
};
build();

let resizing = 0;
addEventListener("resize", () => {
  clearTimeout(resizing);
  resizing = setTimeout(build, 300);
});
// If the wallpaper app lets clicks through, a click provokes Jarvis.
addEventListener("click", () => jarvis?.spike(5));

// ---------- Panel contents ----------
// Decoration only: the telemetry and readings are made up, the clock is real.

const meters = document.getElementById("meters");
for (let k = 0; k < 14; k++) {
  const bar = document.createElement("i");
  bar.style.setProperty("--t", `${rand(3, 7).toFixed(2)}s`);
  bar.style.setProperty("--d", `-${rand(0, 4).toFixed(2)}s`);
  meters.append(bar);
}

const radar = document.getElementById("radar");
for (let k = 0; k < 6; k++) {
  const blip = document.createElement("i");
  const angle = rand(0, 360);
  const dist = rand(15, 45);
  blip.style.left = `${50 + dist * Math.sin((angle * Math.PI) / 180)}%`;
  blip.style.top = `${50 - dist * Math.cos((angle * Math.PI) / 180)}%`;
  // The sweep starts at the top and turns clockwise, so a blip lights up
  // when the sweep reaches its angle.
  blip.style.setProperty("--d", `${(angle / 360) * 6}s`);
  radar.append(blip);
}

const ROW_SETS = {
  "rows-left": [
    ["Neural nodes", () => `${Math.round(rand(9200, 9800))}`],
    ["Synapse rate", () => `${rand(38, 52).toFixed(1)} kHz`],
    ["Memory index", () => `${rand(71, 74).toFixed(2)}%`],
    ["Heuristics", () => pick(["Nominal", "Nominal", "Adaptive", "Learning"])],
  ],
  "rows-right": [
    ["Arc reactor", () => `${rand(98.6, 99.9).toFixed(1)}%`],
    ["Uplink", () => `${Math.round(rand(820, 990))} Mb/s`],
    ["Satellites", () => `${Math.round(rand(11, 14))} locked`],
    ["Threat level", () => pick(["Minimal", "Minimal", "Minimal", "Low"])],
  ],
};
const rows = {};
for (const [id, set] of Object.entries(ROW_SETS)) {
  const box = document.getElementById(id);
  rows[id] = set.map(([name, value]) => {
    const row = document.createElement("div");
    row.innerHTML = `<span>${name}</span><b></b>`;
    box.append(row);
    return { el: row.querySelector("b"), value };
  });
}
const refreshRows = () => {
  for (const list of Object.values(rows)) for (const row of list) row.el.textContent = row.value();
};
refreshRows();

const telemetry = document.getElementById("telemetry");
const VERBS = ["Indexing", "Parsing", "Routing", "Mapping", "Sampling", "Linking", "Caching", "Scanning", "Weighing", "Tracing"];
const NOUNS = ["node", "cluster", "vector", "packet", "sector", "lattice", "thread", "signal"];
const hex = () => Math.floor(rand(0, 0xffff)).toString(16).toUpperCase().padStart(4, "0");
const addLine = () => {
  const line = document.createElement("div");
  line.innerHTML = `<span>0x${hex()}</span>  ${pick(VERBS)} ${pick(NOUNS)} ${Math.floor(rand(1, 99))}  <span>${rand(0, 1).toFixed(3)}</span>`;
  telemetry.prepend(line);
  while (telemetry.children.length > 16) telemetry.lastChild.remove();
};
for (let k = 0; k < 14; k++) addLine();

const wave = document.getElementById("wave-line");
let phase = 0;
const drawWave = () => {
  phase += 0.2;
  const points = [];
  for (let x = 0; x <= 200; x += 4) {
    const y = 30 + 14 * Math.sin(x / 14 + phase) * Math.sin(x / 37 + phase / 3) + rand(-2.5, 2.5);
    points.push(`${x},${y.toFixed(1)}`);
  }
  wave.setAttribute("points", points.join(" "));
};
drawWave();

const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const pad = (n) => String(n).padStart(2, "0");
// ISO week number, the way Swedish calendars count weeks.
const week = (date) => {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
};
const loaded = Date.now();
const tick = () => {
  const now = new Date();
  document.getElementById("time").textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  document.getElementById("date").textContent =
    `${DAYS[now.getDay()]} ${now.getDate()} ${MONTHS[now.getMonth()]} ${now.getFullYear()} · Week ${week(now)}`;
  const up = Math.floor((Date.now() - loaded) / 1000);
  document.getElementById("session").textContent =
    `Session ${pad(Math.floor(up / 3600))}:${pad(Math.floor(up / 60) % 60)}:${pad(up % 60)}`;
};
tick();
setInterval(tick, 1000);

if (!still) {
  setInterval(addLine, 900);
  setInterval(drawWave, 160);
  setInterval(refreshRows, 2600);
  setInterval(() => {
    document.getElementById("sync").textContent = `${rand(99.9, 99.99).toFixed(2)}%`;
  }, 3100);
}
</script>
</body>
</html>
